[project]
name = "procurement-workbench-api"
version = "0.1.0"
description = "智能采购需求工作台 API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "pydantic-settings==2.9.1",
  "PyJWT==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "casbin==1.41.0",
  "openai==1.82.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.12"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
